
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Human vs Trojan | HVT</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #081723;
      color: #e1f4ff;
      padding: 24px;
    }

    main {
      max-width: 660px;
      text-align: center;
      border: 1px solid #23516a;
      border-radius: 16px;
      background: #0d2534;
      padding: 50px 28px;
    }

    h1 {
      font-size: clamp(30px, 6vw, 48px);
      letter-spacing: 2px;
    }

    h1 span { color: #ff416b; }

    p { line-height: 1.9; color: #accbdc; }

    a {
      display: inline-block;
      margin: 16px 8px 0;
      padding: 14px 26px;
      border-radius: 8px;
      text-decoration: none;
      color: white;
      background: #078ba9;
    }

    a.secondary {
      background: transparent;
      border: 1px solid #39708b;
    }
  </style>
</head>

<body>
  <main>

<script src="./lang-switch.js" defer></script>
